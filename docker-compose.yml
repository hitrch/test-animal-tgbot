services:
  db:
    image: postgres:16-alpine
    # Start again after a crash or a computer restart, like the bot
    restart: unless-stopped
    environment:
      POSTGRES_USER: forest
      POSTGRES_PASSWORD: forest
      POSTGRES_DB: forest
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forest -d forest"]
      interval: 2s
      timeout: 5s
      retries: 15

  bot:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://forest:forest@db:5432/forest
    depends_on:
      db:
        # Wait until Postgres accepts connections, not just until it starts
        condition: service_healthy
    restart: unless-stopped

  # Database for pytest only: docker compose --profile test up -d db-test
  db-test:
    image: postgres:16-alpine
    # Not started by a plain "docker compose up"
    profiles: ["test"]
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: test
    # Reachable from this computer only, for tests running outside Docker
    ports:
      - "127.0.0.1:5433:5432"
    # Kept in memory: nothing is left after the container stops
    tmpfs:
      - /var/lib/postgresql/data
    # Lets "up --wait" return only when Postgres accepts connections
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d test"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  db_data: